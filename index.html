<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Random Activity Selector</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="div">
      <h1 style="font-family: Brush Script MT, cursive">What should I do?</h1>
      <p class="p" id="result">Click the button to find out!</p>
      <button id="SelectanActivity" onclick="SelectrandomActivity()">
        Suggest an Activity
      </button>
      <input type="text" id="ActivityInput" placeholder="Add New Activity" />
      <button id="addActivity" onclick="addActivity()">Add</button>
    </div>
    <script src="./main.js"></script>
  </body>
</html>
